<div class="min-h-screen bg-surface-100">
  <header
    class="flex h-16 items-center justify-between border-b border-surface bg-surface-0 px-4 sm:px-6"
  >
    <div class="flex items-center gap-3">
      <button
        type="button"
        class="inline-flex h-10 w-10 items-center justify-center rounded-lg text-color transition-colors hover:bg-surface-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary md:hidden"
        aria-label="Abrir menu de navegação"
        [attr.aria-expanded]="menuAberto()"
        (click)="alternarMenu()"
      >
        <i class="pi pi-bars text-lg" aria-hidden="true"></i>
      </button>

      <div
        class="flex h-10 w-10 items-center justify-center rounded-xl bg-primary text-primary-contrast"
      >
        <i class="pi pi-receipt text-lg"></i>
      </div>

      <div>
        <strong class="block text-lg text-color"> Gestão Fiscal </strong>

        <span class="text-sm text-muted-color"> Estoque e faturamento </span>
      </div>
    </div>
  </header>

  <div class="relative flex min-h-[calc(100vh-4rem)]">
    @if (menuAberto()) {
      <button
        type="button"
        class="fixed inset-0 z-30 bg-black/30 md:hidden"
        aria-label="Fechar menu de navegação"
        (click)="fecharMenu()"
      ></button>
    }

    <aside
      class="fixed inset-y-0 left-0 z-40 w-72 border-r border-surface bg-surface-0 p-4 shadow-xl transition-transform duration-200 md:static md:z-auto md:w-64 md:shrink-0 md:translate-x-0 md:shadow-none"
      [class.-translate-x-full]="!menuAberto()"
    >
      <div class="mb-4 flex items-center gap-3 border-b border-surface pb-6 md:hidden">
        <div
          class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-primary text-primary-contrast"
        >
          <i class="pi pi-receipt text-xl" aria-hidden="true"></i>
        </div>

        <div>
          <strong class="block text-lg leading-tight text-color">Gestão Fiscal</strong>
          <span class="text-sm text-muted-color">Estoque e faturamento</span>
        </div>
      </div>

      <nav class="flex flex-col gap-2" aria-label="Navegação principal">
        <a
          routerLink="/produtos"
          routerLinkActive="bg-primary text-primary-contrast"
          class="flex items-center gap-3 rounded-lg px-4 py-3 text-color transition-colors hover:bg-surface-100"
          (click)="fecharMenu()"
        >
          <i class="pi pi-box"></i>
          <span>Produtos</span>
        </a>

        <a
          routerLink="/notas-fiscais"
          routerLinkActive="bg-primary text-primary-contrast"
          class="flex items-center gap-3 rounded-lg px-4 py-3 text-color transition-colors hover:bg-surface-100"
          (click)="fecharMenu()"
        >
          <i class="pi pi-file"></i>
          <span>Notas fiscais</span>
        </a>
      </nav>
    </aside>

    <main class="min-w-0 flex-1 p-4 sm:p-6 lg:p-8">
      <router-outlet />
    </main>
  </div>
</div>
