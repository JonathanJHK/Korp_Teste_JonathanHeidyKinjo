<section id="listar-produto" class="p-4 md:p-6">
  <div class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <h1 class="text-2xl font-semibold text-surface-900">Produtos</h1>

      <p class="mt-1 text-surface-600">Consulte os produtos disponíveis no estoque.</p>
    </div>

    <div class="flex gap-2">
      <p-button
        label="Atualizar"
        icon="pi pi-refresh"
        severity="secondary"
        [outlined]="true"
        (onClick)="carregarProdutos()"
      />

      <p-button label="Cadastrar produto" icon="pi pi-plus" (onClick)="abrirCadastro()" />
    </div>
  </div>

  <div class="overflow-hidden rounded-xl border border-surface-200 bg-white">
    <p-table
      [value]="produtos()"
      dataKey="id"
      [paginator]="false"
      [rows]="10"
      [rowsPerPageOptions]="[5, 10, 20]"
      [tableStyle]="{ 'min-width': '40rem' }"
    >
      <ng-template #header>
        <tr>
          <th class="w-40">Código</th>
          <th>Descrição</th>
          <th class="w-40 text-center">Saldo</th>
        </tr>
      </ng-template>

      <ng-template #body let-produto>
        <tr>
          <td>
            <span class="font-medium">
              {{ produto.codigo }}
            </span>
          </td>

          <td>
            {{ produto.descricao }}
          </td>

          <td class="text-center">
            {{ produto.saldo }}
          </td>
        </tr>
      </ng-template>

      <ng-template #emptymessage>
        <tr>
          <td colspan="3" class="py-10 text-center text-surface-500">Nenhum produto cadastrado.</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</section>

<app-cadastrar-produto-modal
  [visible]="dialogCadastroVisivel()"
  (visibleChange)="dialogCadastroVisivel.set($event)"
  (produtoCadastrado)="produtoCadastrado()"
/>
